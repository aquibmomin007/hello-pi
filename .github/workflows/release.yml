name: Build and Push to GHCR

# Trigger: only when commits land on the release branch
on:
  push:
    branches:
      - release

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up QEMU — this lets the x86 GitHub runner emulate ARM64
      #    so we can build an image that runs on the Raspberry Pi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Set up Docker Buildx — the builder that supports multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to GitHub Container Registry using the automatic GITHUB_TOKEN
      #    No secrets to configure — GitHub provides this token for free
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build the image for ARM64 (Raspberry Pi 4/5) and push it to GHCR
      #    Tags: latest + the short commit SHA for traceability
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/aquibmomin007/hello-pi:latest
            ghcr.io/aquibmomin007/hello-pi:${{ github.sha }}
