apiVersion: v1
kind: Service
metadata:
  name: hello-pi
spec:
  type: NodePort        # Exposes the service on a port directly on the Pi's IP
  selector:
    app: hello-pi       # Routes traffic to pods with this label
  ports:
    - protocol: TCP
      port: 3000        # Port inside the cluster
      targetPort: 3000  # Port the container listens on
      nodePort: 30080   # Port you'll hit from outside: http://<PI_IP>:30080
